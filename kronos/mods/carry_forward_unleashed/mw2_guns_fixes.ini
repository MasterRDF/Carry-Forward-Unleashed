[mw2_guns_fixes]
sprintfire=on
bo6sprintfire=on
mw3sprintfire=on
muzzleflash=on
papmuzzleflash=on
pap4effects=off
; Build 22f: only the movement animations (walk/jog/sprint) and the sprint timers come from the BO7 gun; every other
; animation and timer stays the gun's own. These lines are optional: empty keeps that default, "off" gives 22c's rules.
sprintdonorstates=
sprintdonortimers=
sprintview=on
; Build 22g: off = Speed Cola only speeds up the MW guns' reloads (no fast-magazine animation unless the gun or an attachment
; asks for it). on = the old behaviour.
perkfastreloads=off
; fav-10 uses the native [1] prompt; retire the old DLL right-click watcher.
favoritesrightclick=off
